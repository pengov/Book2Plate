services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: book2plate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: book2plate_db
      POSTGRES_USER: book2plate_user
      POSTGRES_PASSWORD: book2plate_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book2plate_user -d book2plate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: